<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Vintage Instant Camera Favicon -->
  <rect width="64" height="64" rx="14" fill="#38251B"/>
  <!-- Camera body -->
  <rect x="8" y="16" width="48" height="40" rx="8" fill="#68432D" stroke="#D99A43" stroke-width="2"/>
  <rect x="12" y="20" width="40" height="8" rx="2" fill="#F4E3B2" opacity="0.9"/>
  <!-- Viewfinder -->
  <rect x="14" y="22" width="6" height="4" rx="1" fill="#38251B"/>
  <!-- Flash -->
  <circle cx="48" cy="24" r="3" fill="#FFF9EC"/>
  <!-- Big Lens -->
  <circle cx="32" cy="38" r="14" fill="#38251B" stroke="#D99A43" stroke-width="2"/>
  <circle cx="32" cy="38" r="10" fill="#68432D"/>
  <circle cx="32" cy="38" r="6" fill="#1A110B"/>
  <circle cx="30" cy="36" r="2.5" fill="#FFF9EC" opacity="0.8"/>
  <!-- Red shutter button -->
  <rect x="14" y="12" width="8" height="4" rx="2" fill="#D99A43"/>
</svg>